<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrapbook Theme Mocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9;        /* cream page */
  --card:#FFFFFF;
  --sunk:#F4E9DA;      /* chips, empty slots */
  --line:#EBDFCD;
  --ink:#1E1B19;
  --ink-2:#5C554E;
  --muted:#8E857B;
  /* tag colours: categorical, never decoration */
  --coral:#F07F86;
  --mustard:#F5B840;
  --teal:#2E8A78;
  --lavender:#B8B3F6;
  --orange:#F7954B;
  --pink:#F9CAD5;
  --font:"Outfit",system-ui,sans-serif;
  --page:#F3E2D2;
  --act:#1E1B19;       /* action fill: buttons, dock, toggles */
  --on-act:#FFFFFF;
  --paper:#FFFFFF;     /* print borders, date stickers */
  --on-paper:#1E1B19;
  --on-colour:#1E1B19; /* text on any tag colour, in both themes */
}
/* Dark: warm espresso instead of cream; actions flip to cream; tag colours stay the same paper */
.dark{
  --bg:#191614;
  --card:#24201C;
  --sunk:#2B2520;
  --line:#38312B;
  --ink:#F3ECE3;
  --ink-2:#C9BEB2;
  --muted:#968A7E;
  --page:#0F0D0C;
  --act:#F3ECE3;
  --on-act:#191614;
  --paper:#EFE8DE;
  --on-paper:#1E1B19;
}
.dark .phone[style*="--t:"]{--t:#2E1E27 !important}
.dark .phone{box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.on-c,.m.note,.tile.note{color:var(--on-colour)}
.on-c .l2{color:rgba(30,27,25,.68) !important}
/* Controls sitting on a tag colour keep light-theme contrast in both themes */
.on-c .circle{background:var(--paper);color:var(--on-paper)}
.on-c .btn.dark{background:#1E1B19;color:#fff}
.section.dark{background:var(--page);color:var(--ink);margin:64px -16px -80px;padding:48px 16px 80px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);padding:40px 16px 80px}
.intro{max-width:1240px;margin:0 auto 32px}
.intro h1{font-size:44px;font-weight:700;letter-spacing:-.02em}
.intro p{color:var(--ink-2);margin-top:8px;font-size:15px;max-width:640px;line-height:1.5}
.swatches{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:#FFF8EF;padding:6px 12px 6px 6px;border-radius:999px}
.sw i{width:22px;height:22px;border-radius:50%;display:block}
.grid{display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center;max-width:1300px;margin:0 auto}
figure{width:390px;max-width:100%}
figcaption{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.45}
figcaption b{color:var(--ink);font-weight:600}

.phone{width:390px;max-width:100%;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.status .dots{display:flex;gap:5px}
.status .dots span{width:15px;height:10px;border-radius:2px;background:currentColor}
.status .dots span:first-child{width:12px;opacity:.5}
.content{position:absolute;inset:44px 0 0 0;padding:0 20px}
.handle{position:absolute;bottom:8px;left:50%;width:120px;height:4px;border-radius:2px;background:var(--ink);opacity:.8;transform:translateX(-50%)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.circle{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);flex:none}
.circle.dark{background:var(--act);color:var(--on-act);border-color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:60px}
.title{font-size:42px;font-weight:700;letter-spacing:-.025em;line-height:1}
.meta{font-size:14px;color:var(--muted);margin-top:8px}
.chips{display:flex;gap:8px;margin-top:18px;overflow:hidden}
.chip{height:36px;padding:0 15px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;background:var(--card);border:1.5px solid var(--line);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.on{background:var(--act);color:var(--on-act);border-color:var(--ink)}
.btn{height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;padding:0 24px}
.btn.dark{background:var(--act);color:var(--on-act)}
.btn.light{background:var(--card);border:1.5px solid var(--line)}
.btn .arrow{width:36px;height:36px;border-radius:50%;background:var(--on-act);color:var(--act);display:grid;place-items:center;margin-right:-14px}
.img{background-size:cover;background-position:center;background-color:var(--sunk)}

/* dark dock: the reference's bottom pill, holding the three ways to add */
.dock{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);height:68px;border-radius:999px;background:var(--act);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--on-act)}
.dock a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.dock a.main{background:var(--on-act);color:var(--act);width:56px;height:56px}
.dock a.danger{color:var(--coral)}

/* month */
.bento{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:76px;gap:8px;margin-top:16px}
.tile{border-radius:24px;overflow:hidden;position:relative}
.badge{position:absolute;left:8px;bottom:8px;height:26px;min-width:26px;padding:0 9px;border-radius:999px;background:var(--paper);color:var(--on-paper);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.badge.dark{background:var(--act);color:var(--on-act)}
.tile.note{padding:12px 14px}
.tile.note .d{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile.note p{font-size:14px;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.collage{display:grid;gap:3px;height:100%}
/* scrapbook tiles: kraft table, white prints, tag-coloured note slips */
.tile.scrap{background:var(--sunk)}
.tile.scrap .badge{z-index:5}
.tile .more{position:absolute;right:8px;top:8px;z-index:5;height:22px;padding:0 8px;border-radius:999px;background:var(--act);color:var(--on-act);font-size:12px;font-weight:600;display:flex;align-items:center}
.print{position:absolute;background:var(--paper);padding:3px 3px 8px;border-radius:7px}
.print div{width:100%;height:100%;border-radius:4px;background-size:cover;background-position:center;background-color:var(--line)}
.slip{position:absolute;border-radius:7px;padding:6px 8px;font-weight:600;line-height:1.2}
.slip span{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}

/* day */
.masonry{columns:2;column-gap:10px;margin-top:20px}
.m{break-inside:avoid;margin-bottom:10px;border-radius:24px;overflow:hidden;position:relative}
.m.note{padding:15px 16px 13px}
.m.note p{font-size:16px;line-height:1.38;font-weight:500}
.m .time{font-size:13px;margin-top:10px;opacity:.7;font-weight:500}
.m .ptime{position:absolute;left:10px;bottom:10px;height:26px;padding:0 10px;border-radius:999px;background:var(--paper);color:var(--on-paper);font-size:13px;font-weight:600;display:flex;align-items:center}

/* entry */
.carousel{position:relative;height:430px;margin:18px -20px 0}
.peek{position:absolute;top:26px;bottom:26px;width:300px;border-radius:30px}
.peek.l{right:calc(50% + 150px - 20px)}
.peek.r{left:calc(50% + 150px - 20px)}
.hero{position:absolute;left:50%;top:0;width:300px;height:430px;transform:translateX(-50%);border-radius:40px;box-shadow:0 0 0 12px var(--t)}
.caption{font-size:20px;line-height:1.4;font-weight:500;text-align:center;margin:24px 10px 0}

/* settings */
.group{background:var(--card);border-radius:24px;margin-top:12px;border:1.5px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;gap:12px}
.row+.row{border-top:1.5px solid var(--line)}
.row .l1{font-size:16px;font-weight:500}
.row .l2{font-size:13px;color:var(--muted);margin-top:3px}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--act);position:relative;flex:none}
.toggle::after{content:"";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--on-act)}
.section-label{font-size:13px;color:var(--muted);margin:24px 6px 0;font-weight:500}
</style>
</head>
<body>

<div class="intro">
  <h1>Scrapbook</h1>
  <p>A cream page, chunky round shapes, one bold rounded typeface. Photos stay unframed and loud. Colour appears only where there's no photo: each tag owns a colour, and its notes are printed on it. Every action is a black pill.</p>
  <div class="swatches">
    <span class="sw"><i style="background:#FFF6E9;border:1px solid #e6d8c4"></i>Page</span>
    <span class="sw"><i style="background:#1E1B19"></i>Ink · actions</span>
    <span class="sw"><i style="background:#2E8A78"></i>cricket</span>
    <span class="sw"><i style="background:#F7954B"></i>gym</span>
    <span class="sw"><i style="background:#B8B3F6"></i>office</span>
    <span class="sw"><i style="background:#F5B840"></i>badminton</span>
    <span class="sw"><i style="background:#F9CAD5"></i>no tag</span>
    <span class="sw"><i style="background:#F07F86"></i>delete</span>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></symbol>
  <symbol id="img" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9.5" cy="9.5" r="1.5"/><path d="M20 15l-4-4-8 9"/></symbol>
  <symbol id="flash" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="flip" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5l2 2M20 12a8 8 0 01-14 5l-2-2M20 4v5h-5M4 20v-5h5"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
</svg>

<div class="grid">

<!-- 1 CAPTURE -->
<figure>
<div class="phone">
  <div class="status"><span>12:34</span><span class="dots"><span></span><span></span></span></div>
  <div class="content" style="padding:0 12px">
    <div class="img" style="height:560px;border-radius:36px;margin-top:4px;position:relative;background-image:url(https://picsum.photos/id/1060/800/1100)">
      <div style="position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between">
        <div class="circle" style="border:none"><svg class="i"><use href="#flash"/></svg></div>
        <div class="circle" style="border:none"><svg class="i"><use href="#flip"/></svg></div>
      </div>
    </div>
    <div style="margin:12px 4px 0;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;background:var(--card);border:1.5px solid var(--line)">
      <span style="font-size:15px;font-weight:600">Today <span style="color:var(--muted);font-weight:500">· 3 entries</span></span>
      <span style="display:flex;gap:4px;align-items:center">
        <span class="img" style="width:36px;height:36px;border-radius:12px;background-image:url(https://picsum.photos/id/431/100/100)"></span>
        <span style="width:36px;height:36px;border-radius:12px;background:var(--lavender)"></span>
        <span class="img" style="width:36px;height:36px;border-radius:12px;background-image:url(https://picsum.photos/id/513/100/100)"></span>
      </span>
    </div>
    <div style="position:absolute;left:24px;right:24px;bottom:40px;display:flex;align-items:center;justify-content:space-between">
      <div class="circle" style="width:54px;height:54px"><svg class="i"><use href="#img"/></svg></div>
      <div style="width:86px;height:86px;border-radius:50%;background:var(--act);display:grid;place-items:center">
        <div style="width:66px;height:66px;border-radius:50%;background:var(--on-act)"></div>
      </div>
      <div class="circle" style="width:54px;height:54px"><svg class="i"><use href="#pen"/></svg></div>
    </div>
  </div>
  <div class="handle"></div>
</div>
<figcaption><b>Capture.</b> Viewfinder on cream. The shutter is a black disc with a white core, the same language as every action. The lavender square in Today's strip is a text note.</figcaption>
</figure>

<!-- 2 REVIEW -->
<figure>
<div class="phone">
  <div class="status"><span>12:35</span><span class="dots"><span></span><span></span></span></div>
  <div class="content">
    <div class="topbar">
      <div class="circle"><svg class="i"><use href="#x"/></svg></div>
      <span style="font-size:14px;color:var(--muted);font-weight:500">Today, 12:35</span>
      <div style="width:46px"></div>
    </div>
    <div class="img" style="height:450px;border-radius:36px;background-image:url(https://picsum.photos/id/431/800/1000)"></div>
    <div style="font-size:21px;font-weight:500;color:var(--muted);margin:22px 4px 0">Add a line about this…</div>
    <div class="chips" style="margin-top:14px">
      <span class="chip">+ tag</span>
      <span class="chip"><i style="background:var(--lavender)"></i>office</span>
      <span class="chip"><i style="background:var(--orange)"></i>gym</span>
      <span class="chip"><i style="background:var(--teal)"></i>cricket</span>
    </div>
    <div style="position:absolute;left:20px;right:20px;bottom:34px;display:flex;gap:10px">
      <div class="btn light" style="flex:1">Retake</div>
      <div class="btn dark" style="flex:1.7;justify-content:space-between">Save to today<span class="arrow"><svg class="i" style="width:18px;height:18px"><use href="#arrow"/></svg></span></div>
    </div>
  </div>
  <div class="handle"></div>
</div>
<figcaption><b>Review.</b> Tag chips carry their colour dot, so you learn the colours before you see them on the month. The black pill with a white arrow comes straight from the reference.</figcaption>
</figure>

<!-- 3 MONTH -->
<figure>
<div class="phone">
  <div class="status"><span>12:36</span><span class="dots"><span></span><span></span></span></div>
  <div class="content">
    <div class="topbar" style="height:auto;margin-top:16px;align-items:flex-start">
      <div><div class="title">October</div><div class="meta">9 days · 14 entries</div></div>
      <div class="circle"><svg class="i"><use href="#gear"/></svg></div>
    </div>
    <div class="chips"><span class="chip on">All</span><span class="chip"><i style="background:var(--teal)"></i>cricket</span><span class="chip"><i style="background:var(--orange)"></i>gym</span><span class="chip"><i style="background:var(--lavender)"></i>office</span></div>
    <div class="bento">
      <div class="tile scrap" style="grid-column:span 2;grid-row:span 3" data-day="26" data-size="large"
        data-items='[{"p":431},{"n":"Lunch with Ravi and Meera at the dosa place","c":"lavender"},{"p":513},{"p":274},{"n":"Couldn&apos;t sleep. Finished the book.","c":"pink"}]'>
        <span class="badge dark">Today · 26</span><span class="more">+2</span></div>
      <div class="tile scrap" style="grid-row:span 2" data-day="24" data-items='[{"p":1047},{"p":1080}]'><span class="badge">24</span></div>
      <div class="tile scrap" data-day="23" data-items='[{"n":"21–19 in the last game!","c":"mustard"}]'><span class="badge">23</span></div>
      <div class="tile scrap" style="grid-column:span 2;grid-row:span 2" data-day="25"
        data-items='[{"n":"Slow Saturday. Cleaned the flat, finally replaced the kitchen bulb.","c":"pink"},{"p":1025},{"p":312}]'><span class="badge">25</span></div>
      <div class="tile scrap" style="grid-row:span 2" data-day="22" data-items='[{"p":1015}]'><span class="badge">22</span></div>
      <div class="tile scrap" style="grid-row:span 2" data-day="20" data-items='[{"p":1011},{"n":"Won by 4 wickets","c":"teal"}]'><span class="badge">20</span></div>
      <div class="tile scrap" style="grid-column:span 2;grid-row:span 2" data-day="19"
        data-items='[{"n":"Leg day. Barely made it down the stairs.","c":"orange"},{"p":1062},{"p":429},{"p":1069}]'><span class="badge">19</span></div>
    </div>
  </div>
  <div class="dock"><a><svg class="i"><use href="#img"/></svg></a><a class="main"><svg class="i"><use href="#cam"/></svg></a><a><svg class="i"><use href="#pen"/></svg></a></div>
  <div class="handle"></div>
</div>
<figcaption><b>Month.</b> Your current scrapbook layout, restyled. Each day is a kraft-paper tile with its photos dropped on it as tilted white prints and its notes as slips in their tag's colour, scattered by the same seeded algorithm as the app's Scatter.kt. The black dock gives all three ways to add.</figcaption>
</figure>

<!-- 4 MONTH EMPTY -->
<figure>
<div class="phone">
  <div class="status"><span>09:02</span><span class="dots"><span></span><span></span></span></div>
  <div class="content">
    <div class="topbar" style="height:auto;margin-top:16px;align-items:flex-start">
      <div><div class="title">November</div><div class="meta">Nothing yet</div></div>
      <div class="circle"><svg class="i"><use href="#gear"/></svg></div>
    </div>
    <div style="margin-top:96px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="position:relative;width:210px;height:140px">
        <div style="position:absolute;left:8px;top:20px;width:82px;height:108px;border-radius:24px;background:var(--teal);transform:rotate(-10deg)"></div>
        <div class="on-c" style="position:absolute;left:64px;top:0;width:82px;height:108px;border-radius:24px;background:var(--mustard);display:grid;place-items:center;font-size:34px;font-weight:700">1</div>
        <div style="position:absolute;right:8px;top:24px;width:82px;height:108px;border-radius:24px;background:var(--coral);transform:rotate(9deg)"></div>
      </div>
      <div style="font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:28px">A fresh month.</div>
      <p style="font-size:16px;color:var(--ink-2);margin-top:10px;line-height:1.5;max-width:270px">Every day you capture becomes a tile here. Busier days get bigger.</p>
      <div class="btn dark" style="margin-top:28px;gap:14px">Take the first photo<span class="arrow"><svg class="i" style="width:18px;height:18px"><use href="#arrow"/></svg></span></div>
      <div style="font-size:15px;color:var(--ink-2);margin-top:18px;font-weight:500">or <u style="text-underline-offset:3px">look back at October</u></div>
    </div>
  </div>
  <div class="handle"></div>
</div>
<figcaption><b>Month, empty.</b> The playful bit lives here: three blank coloured tiles, with day 1 waiting.</figcaption>
</figure>

<!-- 5 DAY -->
<figure>
<div class="phone">
  <div class="status"><span>12:37</span><span class="dots"><span></span><span></span></span></div>
  <div class="content">
    <div class="topbar"><div class="circle"><svg class="i"><use href="#back"/></svg></div></div>
    <div class="title" style="margin-top:4px">Monday, 26</div>
    <div class="meta">Today · 4 entries</div>
    <div class="masonry">
      <div class="m img" style="height:240px;background-image:url(https://picsum.photos/id/431/400/600)"><span class="ptime">08:42</span></div>
      <div class="m note" style="background:var(--lavender)"><p>Lunch with Ravi and Meera at the dosa place near the station. Ravi finally said yes to the Coorg trip in December, so now someone has to actually book it.</p><div class="time">13:15 · office</div></div>
      <div class="m img" style="height:150px;background-image:url(https://picsum.photos/id/513/400/300)"><span class="ptime">13:02</span></div>
      <div class="m img" style="height:200px;background-image:url(https://picsum.photos/id/274/400/560)"><span class="ptime">18:30</span></div>
      <div class="m note" style="background:var(--pink)"><p>Couldn't sleep. Finished the book.</p><div class="time">23:50</div></div>
    </div>

</div>
<script>
// Port of bento/Scatter.kt: a loose grid sized to the tile, each item nudged and tilted, kept inside the tile.
const MAX_TILT = 7;
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function scatter(count, aspect, seed){
  const r = rng(seed), spread = range => (r()-0.5)*range;
  if (count === 1){const w=.78,h=.72;return [{x:(1-w)/2+spread(.08),y:(1-h)/2+spread(.08),w,h,rot:spread(MAX_TILT)}]}
  const cols = Math.min(count, Math.max(1, Math.ceil(Math.sqrt(count*aspect))));
  const rows = Math.ceil(count/cols), cw = 1/cols, ch = 1/rows, w = cw*.95, h = ch*.95;
  return Array.from({length:count},(_,i)=>{
    const row = Math.floor(i/cols), inRow = row===rows-1 ? count-row*cols : cols, col = i%cols;
    const cx = (col+.5)*cw + (cols-inRow)*cw/2 + spread(.35*cw), cy = (row+.5)*ch + spread(.35*ch);
    const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    return {x:clamp(cx,w/2,1-w/2)-w/2, y:clamp(cy,h/2,1-h/2)-h/2, w, h, rot:spread(2*MAX_TILT)};
  });
}
const ON_DARK = {teal:true};
// The same screens again in the dark theme, below the light ones. Same seeds, so the months match.
{
  const grid = document.querySelector('.grid'), section = document.createElement('div');
  section.className = 'section dark';
  section.innerHTML = '<div class="intro"><h1>Scrapbook, dark</h1><p>Warm espresso instead of black, so photos and tag colours keep their warmth at night. Actions flip to cream pills, and prints keep white borders. Tag colours stay identical across themes, so a gym note is always orange.</p></div>';
  const dark = grid.cloneNode(true);
  // Captions were written for light; swap the colour words that flip.
  dark.querySelectorAll('figcaption').forEach(c => {
    c.innerHTML = c.innerHTML.replace(/on cream|bare cream/g, m => m.replace('cream', 'espresso'))
      .replace(/white core/g, 'dark core').replace(/Plain white groups/g, 'Plain dark groups')
      .replace(/\bblack\b/g, 'cream').replace(/\bBlack\b/g, 'Cream');
  });
  section.appendChild(dark);
  grid.after(section);
}
document.querySelectorAll('.tile.scrap').forEach(tile => {
  const items = JSON.parse(tile.dataset.items);
  const pad = {l:7, t:7, r:7, b:30};
  const W = tile.clientWidth - pad.l - pad.r, H = tile.clientHeight - pad.t - pad.b;
  const spots = scatter(items.length, W/H, +tile.dataset.day * 7919);
  const noteSize = items.length === 1 ? 15 : tile.dataset.size === 'large' ? 13 : 12;
  items.map((it,i)=>[it,spots[i]]).sort((a,b)=>('n' in a[0]) - ('n' in b[0])).forEach(([it,s]) => {
    const el = document.createElement('div');
    if ('p' in it){
      el.className = 'print';
      el.innerHTML = `<div style="background-image:url(https://picsum.photos/id/${it.p}/300/300)"></div>`;
      Object.assign(el.style,{left:pad.l+s.x*W+'px',top:pad.t+s.y*H+'px',width:s.w*W+'px',height:s.h*H+'px'});
    } else {
      // Words need more width than a print, so a note spreads around its spot and may lie across a neighbour.
      const w = Math.min(.95, s.w*1.6), x = Math.min(1-w, Math.max(0, s.x+s.w/2-w/2));
      // As many lines as the tile has room for, at most 4 for a lone note and 3 otherwise.
      const fits = Math.max(1, Math.floor((H + pad.b/2 - 12) / (noteSize*1.2)));
      el.className = 'slip';
      el.innerHTML = '<span></span>';
      el.firstChild.textContent = it.n;
      el.firstChild.style.webkitLineClamp = Math.min(items.length===1 ? 4 : 3, fits);
      Object.assign(el.style,{left:pad.l+x*W+'px',width:w*W+'px',fontSize:noteSize+'px',background:`var(--${it.c})`,color:ON_DARK[it.c]?'#fff':'var(--on-colour)'});
      if (tile.closest('.plain')) Object.assign(el.style,{background:'transparent',color:'var(--ink)',padding:'2px 4px'});
      tile.appendChild(el);
      const cy = pad.t+(s.y+s.h/2)*H, top = Math.min(pad.t+H-el.offsetHeight, Math.max(pad.t, cy-el.offsetHeight/2));
      el.style.top = top+'px';
    }
    el.style.transform = `rotate(${s.rot}deg)`;
    tile.appendChild(el);
  });
});
</script>
