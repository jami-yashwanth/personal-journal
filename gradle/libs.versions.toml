[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
camerax = "1.6.2"
coil = "3.6.3"
biometric = "1.1.0"
work = "2.12.0"
datastore = "1.3.0"
exif = "1.4.2"
coreKtx = "1.19.1"
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
junit = "4.13.2"
robolectric = "4.17"
androidxTest = "1.7.0"
androidxJunit = "1.3.0"
